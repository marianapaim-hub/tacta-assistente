<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat com a IA — Assistente Tacta</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="pular-link" href="#conteudo-principal">Pular para o conteúdo</a>

  <header>
    <h1>Chat com a IA</h1>
    <p><a href="index.html">&larr; Voltar ao início</a></p>
  </header>

  <main id="conteudo-principal">
    <p>Pergunte sobre robótica ou peça pra te guiar na montagem de um circuito simples, como acender um LED.</p>

    <div class="acoes-narracao">
      <button type="button" id="botao-parar">Parar narração</button>
    </div>

    <div id="historico-chat" role="log" aria-live="polite" aria-label="Histórico da conversa"></div>

    <p id="status-chat" role="status" aria-live="polite"></p>

    <form id="formulario-chat">
      <label for="campo-mensagem">Sua mensagem</label>
      <input type="text" id="campo-mensagem" name="mensagem" autocomplete="off" required>
      <button type="button" id="botao-microfone" aria-pressed="false">🎤 Falar</button>
      <button type="submit">Enviar</button>
    </form>
  </main>

  <script src="js/chat.js"></script>
</body>
</html>
