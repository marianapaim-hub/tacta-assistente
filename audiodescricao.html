<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audiodescrição dos componentes — Assistente Tacta</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="pular-link" href="#conteudo-principal">Pular para o conteúdo</a>

  <header>
    <h1>Audiodescrição dos componentes</h1>
    <p><a href="index.html">&larr; Voltar ao início</a></p>
  </header>

  <main id="conteudo-principal">
    <p>Escolha um componente na lista abaixo para ouvir a narração sobre ele.</p>

    <div class="acoes-narracao">
      <button type="button" id="botao-parar">Parar narração</button>
    </div>

    <p id="status-narracao" role="status" aria-live="polite"></p>

    <ul id="lista-componentes" aria-label="Lista de componentes do Tacta">
      <!-- Preenchido dinamicamente por js/audiodescricao.js -->
    </ul>
  </main>

  <script src="js/audiodescricao.js"></script>
</body>
</html>
